name: Change2Task CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Method release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Change2Task
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run lint
        run: python -m ruff check .

      - name: Validate release example and schema
        run: |
          change2task validate-case examples/task_case.synthetic.json
          change2task case-schema --output schemas/task-case.schema.json
          git diff --exit-code -- schemas/task-case.schema.json

      - name: Validate public task corpus
        run: |
          python scripts/validate_public_dataset.py data/v1
          cd data/v1
          sha256sum -c CHECKSUMS.sha256

      - name: Validate agent skill
        run: |
          bash -n scripts/install.sh scripts/install_skill.sh
          bash scripts/install_skill.sh \
            --source .cursor/skills/change2task \
            --destination "$RUNNER_TEMP/change2task-skill"
          test -f "$RUNNER_TEMP/change2task-skill/SKILL.md"

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    if: github.repository == 'microsoft/RepoLaunch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          tag_version = tag.removeprefix("v")
          # Allow descriptive release tags while keeping the package version authoritative.
          suffix = tag_version.removeprefix(f"{version}-")
          has_description = tag_version.startswith(f"{version}-") and bool(suffix)
          if tag_version != version and not has_description:
              raise SystemExit(
                  f"Release tag {tag!r} must match package version {version!r}, "
                  "with an optional 'v' prefix and '-description' suffix."
              )
          PY

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: |
          python -m venv package-check
          package-check/bin/python -m pip install "${GITHUB_WORKSPACE}"/dist/*.whl
          package-check/bin/python -m pip check
          package-check/bin/python -I -c "from launch.api import LaunchedInstance"
          package-check/bin/launch --help
          package-check/bin/python -I -m launch.run --help
          package-check/bin/python -I -m launch.scripts.collect -- --help
          package-check/bin/python -I -m launch.scripts.upload_docker -- --help
          package-check/bin/python -I -m launch.scripts.gen_dockerfile --help

      - name: Store distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/repolaunch/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0

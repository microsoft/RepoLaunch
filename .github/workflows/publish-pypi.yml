name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    if: github.repository == 'microsoft/RepoLaunch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          tag_version = tag.removeprefix("v")
          # Allow descriptive release tags while keeping the package version authoritative.
          suffix = tag_version.removeprefix(f"{version}-")
          has_description = tag_version.startswith(f"{version}-") and bool(suffix)
          if tag_version != version and not has_description:
              raise SystemExit(
                  f"Release tag {tag!r} must match package version {version!r}, "
                  "with an optional 'v' prefix and '-description' suffix."
              )
          PY

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: |
          python -m venv package-check
          package-check/bin/python -m pip install "${GITHUB_WORKSPACE}"/dist/*.whl
          package-check/bin/python -m pip check
          package-check/bin/python -I -c "from launch.api import LaunchedInstance"
          package-check/bin/launch --help
          package-check/bin/python -I -m launch.run --help
          package-check/bin/python -I -m launch.scripts.collect -- --help
          package-check/bin/python -I -m launch.scripts.upload_docker -- --help
          package-check/bin/python -I -m launch.scripts.gen_dockerfile --help

      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/repolaunch/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
